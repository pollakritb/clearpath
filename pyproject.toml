[project]
name = "clearpath-backend"
version = "0.1.0"
description = "ClearPath PM2.5 forecast and trusted community monitoring API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27",
    "numpy>=2.0",
    "supabase>=2.7",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.20",
    "Pillow>=12.3,<13.0",
    "pywebpush>=2.0,<3.0",
    "truststore>=0.9",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv", ".next", "node_modules", "docs/eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"backend/routers/*.py" = ["B008"]
"backend/core/admin.py" = ["B008"]
