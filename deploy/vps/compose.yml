name: clearpath

x-runtime: &runtime
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  web:
    <<: *runtime
    image: clearpath-web:${RELEASE_TAG:?Set RELEASE_TAG}
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set public Supabase URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Set public anon key}
    mem_limit: 512m
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  api:
    <<: *runtime
    image: clearpath-api:${RELEASE_TAG:?Set RELEASE_TAG}
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.api
    env_file:
      - path: .env.backend
        format: raw
    mem_limit: 1g
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  gateway:
    <<: *runtime
    image: caddy:2-alpine
    # The official Caddy binary carries this file capability, even on port 8080.
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 128m
    volumes:
      - ./Caddyfile.internal:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:${LOCAL_PORT:-18080}:8080"
    networks:
      default:
      edge:
        aliases:
          - clearpath-gateway
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/api/health",
        ]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

networks:
  edge:
    external: true
    name: ${EDGE_NETWORK:-vireana_vireana-net}
