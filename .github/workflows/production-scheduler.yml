name: Production backup scheduler

on:
  workflow_dispatch:
  schedule:
    # GitHub documents that scheduled events may be delayed or dropped. Two
    # off-peak offsets provide a free-tier backup to the primary Supabase cron.
    - cron: "7,37 * * * *"

permissions:
  contents: read

concurrency:
  group: clearpath-production-backup
  cancel-in-progress: false

jobs:
  invoke-production-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLEARPATH_PRODUCTION_URL: ${{ vars.CLEARPATH_PRODUCTION_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Validate scheduler configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLEARPATH_PRODUCTION_URL:-}" || {
            echo "::error::Missing repository variable CLEARPATH_PRODUCTION_URL"
            exit 1
          }
          test -n "${CRON_SECRET:-}" || {
            echo "::error::Missing repository secret CRON_SECRET"
            exit 1
          }
          case "$CLEARPATH_PRODUCTION_URL" in
            https://*) ;;
            *)
              echo "::error::CLEARPATH_PRODUCTION_URL must use https://"
              exit 1
              ;;
          esac

      - name: Invoke protected production jobs
        shell: bash
        run: |
          set -euo pipefail
          base_url="${CLEARPATH_PRODUCTION_URL%/}"

          invoke() {
            local path="$1"
            local status
            if ! status="$(curl \
              --fail \
              --silent \
              --show-error \
              --max-time 70 \
              --retry 2 \
              --retry-all-errors \
              --retry-delay 5 \
              --output /dev/null \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer ${CRON_SECRET}" \
              "${base_url}${path}")"; then
              echo "::error::Request failed for ${path}"
              return 1
            fi
            case "$status" in
              2??) ;;
              *)
                echo "::error::Unexpected HTTP ${status} for ${path}"
                return 1
                ;;
            esac
            echo "Completed ${path}"
          }

          verify_readiness() {
            local body
            if ! body="$(curl \
              --fail \
              --silent \
              --show-error \
              --max-time 30 \
              --retry 2 \
              --retry-all-errors \
              --retry-delay 5 \
              "${base_url}/api/ready")"; then
              echo "::error::Readiness request failed after sync"
              return 1
            fi
            if ! jq -e '
              .status == "ready" and
              .fresh_station_count > 0 and
              .fresh_max_age_minutes == 60 and
              .surface_max_age_minutes == 90
            ' <<<"$body" >/dev/null; then
              echo "::error::Production remained stale or returned an unexpected freshness contract after sync"
              jq '{status, reason, station_count, fresh_station_count, delayed_station_count, expired_station_count, latest_recorded_at}' <<<"$body"
              return 1
            fi
            jq '{status, station_count, fresh_station_count, delayed_station_count, expired_station_count, latest_recorded_at}' <<<"$body"
          }

          failures=0
          invoke "/api/cron/sync" || failures=1
          verify_readiness || failures=1
          invoke "/api/cron/alerts" || failures=1

          # Forecast generation, provider sync, and evaluation are intentionally
          # paused during the ClearPath forecast reset. Air4Thai ingestion and
          # community/notification jobs remain active.

          exit "$failures"
