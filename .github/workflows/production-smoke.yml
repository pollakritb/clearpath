name: Production smoke

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Quality]
    types: [completed]

permissions:
  contents: read

concurrency:
  # A workflow_run event is emitted for every Quality run, including
  # Dependabot pull requests. Isolate releases by SHA so an unrelated skipped
  # smoke workflow can never cancel the production release currently syncing.
  group: clearpath-production-smoke-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  verify-production:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLEARPATH_PRODUCTION_URL: ${{ vars.CLEARPATH_PRODUCTION_URL }}
      EXPECTED_RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify release and report data freshness independently
        run: python scripts/production_smoke.py
