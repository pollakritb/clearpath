name: Nightly integration

on:
  workflow_dispatch:
  schedule:
    - cron: "23 18 * * *"

permissions:
  contents: read

concurrency:
  group: clearpath-nightly-integration
  cancel-in-progress: true

jobs:
  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest --cov=backend --cov-report=term-missing --cov-fail-under=80

  browser-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements.txt uvicorn
      - run: npx playwright install --with-deps chromium
      - run: npm run build:e2e
      - run: npm run test:e2e
        env:
          CI: "true"
