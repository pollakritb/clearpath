name: Forecast candidate dry run

on:
  workflow_dispatch:
  schedule:
    - cron: "20 2 1 * *"

permissions:
  contents: read

concurrency:
  group: forecast-candidate-dry-run
  cancel-in-progress: false

jobs:
  staging-candidate:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 60
    env:
      APP_ENVIRONMENT: staging
      LOCAL_DEMO_MODE: "false"
      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Export immutable 400-day staging window
        run: |
          SINCE="$(date -u -d '400 days ago' +'%Y-%m-%dT00:00:00Z')"
          python -m scripts.export_forecast_training --since "$SINCE" --output data/forecast_training.csv
      - name: Train and backtest candidates
        run: python -m scripts.train_forecast data/forecast_training.csv --output backend/model_artifacts
      - name: Verify registry payload without writing
        run: python -m scripts.register_forecast_models --directory backend/model_artifacts --environment staging
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast-candidate-${{ github.run_id }}
          path: |
            data/forecast_training.manifest.json
            backend/model_artifacts/*.model-card.json
            backend/model_artifacts/*.backtest.json
            backend/model_artifacts/forecast_h*.json
          retention-days: 30

# This workflow intentionally has no --apply or promotion command. A named
# human reviews the checksums/model cards and records a separate release decision.
